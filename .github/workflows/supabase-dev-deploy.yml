name: DEV Supabase Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate migrations or deploy them to DEV after validation
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy

permissions:
  contents: read

concurrency:
  group: supabase-dev-deployment
  cancel-in-progress: false

jobs:
  migrate-dev:
    name: ${{ inputs.operation == 'deploy' && 'Deploy migrations to DEV' || 'Dry-run migrations against DEV' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      DEV_PROJECT_REF: iserxjzcqwyphyvzlatr
      BLOCKED_PRODUCTION_PROJECT_REF: verjvldpfyubgzurpxzp
      REQUESTED_OPERATION: ${{ inputs.operation }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Verify DEVELOPMENT target and credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "TARGET ENVIRONMENT: DEVELOPMENT"
          echo "DEV PROJECT REF: ${DEV_PROJECT_REF}"

          if [[ "${DEV_PROJECT_REF}" == "${BLOCKED_PRODUCTION_PROJECT_REF}" ]]; then
            echo "ERROR: The selected target is the blocked Production project." >&2
            exit 1
          fi

          if [[ "${DEV_PROJECT_REF}" != "iserxjzcqwyphyvzlatr" ]]; then
            echo "ERROR: The target is not the approved DEV project." >&2
            exit 1
          fi

          if [[ "${REQUESTED_OPERATION}" != "dry-run" && "${REQUESTED_OPERATION}" != "deploy" ]]; then
            echo "ERROR: The requested operation is not supported." >&2
            exit 1
          fi

          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "ERROR: Required development environment secrets are not configured." >&2
            exit 1
          fi

      - name: Link approved DEV project
        run: supabase link --project-ref "$DEV_PROJECT_REF"

      - name: List linked migration history
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 | tee "$RUNNER_TEMP/migration-list.txt"

      - name: Validate pending migrations with dry run
        id: dry_run
        shell: bash
        run: |
          set -o pipefail
          supabase db push --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          echo "deployment_allowed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy migrations to DEV
        if: inputs.operation == 'deploy' && steps.dry_run.outputs.deployment_allowed == 'true'
        shell: bash
        run: |
          set -o pipefail
          supabase db push 2>&1 | tee "$RUNNER_TEMP/deploy.txt"

      - name: Write DEV migration summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
        run: |
          {
            echo "## DEV Supabase Migration"
            echo
            echo "- **Target environment:** DEVELOPMENT"
            echo "- **DEV project ref:** \`${DEV_PROJECT_REF}\`"
            echo "- **Requested operation:** \`${OPERATION}\`"
            echo "- **Dry-run result:** \`${DRY_RUN_OUTCOME}\`"
            if [[ "${DRY_RUN_OUTCOME}" == "success" ]]; then
              echo "- **Deployment allowed by validation:** yes"
            else
              echo "- **Deployment allowed by validation:** no"
            fi

            echo
            echo "### Linked migration history"
            echo '```text'
            if [[ -f "$RUNNER_TEMP/migration-list.txt" ]]; then
              cat "$RUNNER_TEMP/migration-list.txt"
            else
              echo "Unavailable because an earlier safety step failed."
            fi
            echo '```'

            echo
            echo "### Pending migration dry run"
            echo '```text'
            if [[ -f "$RUNNER_TEMP/dry-run.txt" ]]; then
              cat "$RUNNER_TEMP/dry-run.txt"
            else
              echo "Not run because an earlier safety step failed."
            fi
            echo '```'

            if [[ -f "$RUNNER_TEMP/deploy.txt" ]]; then
              echo
              echo "### DEV deployment"
              echo '```text'
              cat "$RUNNER_TEMP/deploy.txt"
              echo '```'
            elif [[ "${OPERATION}" == "dry-run" ]]; then
              echo
              echo "No migration was deployed because this was a dry run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
