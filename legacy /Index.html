<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPH Media - Project Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'sph-blue': '#4da6ff', 
                        'sph-light-blue': '#80bfff',
                        'sph-dark-bg': '#111827', 
                        'sph-card-bg': '#1f2937', 
                        'sph-card-hover': '#374151', 
                        'sph-border': '#374151',
                        'status-not-started': '#6b7280', 
                        'status-on-track': '#22c55e', 
                        'status-at-risk': '#eab308',
                        'status-overdue': '#ef4444', 
                        'status-completed': '#3b82f6', 
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #111827; 
            color: #f3f4f6; 
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .gantt-bar-container { position: relative; }
        
        .gantt-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%; 
            left: 50%;
            transform: translateX(-50%);
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 100; 
            white-space: nowrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            transition: opacity 0.2s, visibility 0.2s;
            margin-bottom: 8px;
            font-size: 0.75rem;
            pointer-events: none; 
            border: 1px solid #374151;
        }
        
        .gantt-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #000000 transparent transparent transparent;
        }

        .gantt-bar-container:hover .gantt-tooltip {
            visibility: visible;
            opacity: 1;
        }

        .gantt-bar {
            transition: transform 0.1s ease-in-out, filter 0.1s ease-in-out;
            border-radius: 2px;
        }
        .gantt-bar-container:hover .gantt-bar {
            transform: scaleY(1.1);
            filter: brightness(1.2);
            z-index: 40;
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
        }

        input, select, textarea {
            background-color: #374151; 
            color: #f3f4f6;
            border-color: #4b5563; 
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4da6ff; 
            border-color: transparent;
        }
        
        input.header-input {
            background-color: #1f2937;
            color: #4da6ff;
            border-bottom-color: #4da6ff;
        }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* STREAMING_CHUNK: Injecting Executive PDF Print Styles... */
        @media print {
            @page {
                size: landscape;
                margin: 0.4in;
            }
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #111827 !important;
            }
            .print-hide {
                display: none !important;
            }
            .print-avoid-break {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            /* Remove shadows for cleaner print */
            * {
                box-shadow: none !important;
            }
            /* Ensure the root container takes full width */
            #root, .max-w-7xl {
                max-width: 100% !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="dark:bg-sph-dark-bg text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        // Mock data fallback for local dev
        const initialData = [
            {
                id: 'p1', name: 'News Centre Firewalls Tech Refresh', department: 'Infra & Ops', projectType: 'Key Project', sponsor: 'Jeffrey Toh', manager: 'Samuel Lim (SL)', techLead: 'Wong Yoke How (YH)', teamMembers: 'Kyaw Thet (KT), Krisna Karmadwiyarsa (KK)', objective: 'Refresh aging News Centre (NC) Firewalls reaching end of life in 2026 and integrate them into a clustered design with Print Centre (PC) Firewalls.', scope: 'Procurement and deployment of new 2 units of Firewalls in NC to replace ageing devices nearing end of life.\nMigrate firewall rulesets, configurations, and policies to the new environment.', budget: '$495K', actualSpend: '$369K', overallStatus: 'On Track',
                activities: [
                    { id: 'a1', name: 'NM F5 Migration', startYear: 2026, startMonth: 0, duration: 0.5, status: 'Completed', isMilestone: true, category: 'Execution', level: 0, comments: [] },
                    { id: 'a2', name: 'Firewall Installation and VDOM creation', startYear: 2026, startMonth: 0.5, duration: 2.5, status: 'Completed', isMilestone: true, category: 'Execution', level: 0, comments: [] }
                ],
                raidItems: [
                    { id: 'r1', type: 'Issue', description: 'Server delivery delayed by 2 weeks due to customs.', owner: 'J. Toh', status: 'Open', startDate: '2026-01-15T00:00:00.000Z', endDate: '2026-01-29T00:00:00.000Z', comments: [] },
                    { id: 'r2', type: 'Risk', description: 'Potential budget overrun on licensing if FX rates drop.', owner: 'S. Lim', status: 'Mitigated', startDate: '2026-02-01T00:00:00.000Z', endDate: '2026-09-30T00:00:00.000Z', comments: [] }
                ],
                tasks: [
                    { id: 't1', date: new Date().toISOString(), name: 'Submit PO', details: 'Submit PO to procurement for firewalls', status: 'Pending' },
                    { id: 't2', date: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString(), name: 'Vendor Brief', details: 'Walkthrough of constraints', status: 'Completed' }
                ]
            },
            {
                id: 'p2', name: 'Routine Server Patching Q3', department: 'Infra & Ops', projectType: 'BAU Project', sponsor: 'Jeffrey Toh', manager: 'Samuel Lim (SL)', techLead: 'Kyaw Thet (KT)', teamMembers: '', objective: 'Quarterly OS patching for all Windows servers in the DMZ.', scope: 'Apply Q3 security patches.', budget: '$0', actualSpend: '$0', overallStatus: 'Not Started',
                activities: [], raidItems: [], tasks: []
            }
        ];

        const ALL_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const DEPARTMENTS = ['ALL', 'Infra & Ops', 'Corp Systems', 'Cyber Security', 'Digital Workspace'];
        
        const STATUS_COLORS = {
            'Not Started': 'bg-status-not-started',
            'On Track': 'bg-status-on-track',
            'At Risk': 'bg-status-at-risk',
            'Overdue': 'bg-status-overdue',
            'Completed': 'bg-status-completed'
        };

        const TASK_STATUS_STYLES = {
            'Pending': 'text-gray-400 bg-gray-800 border-gray-700',
            'In Progress': 'text-sph-blue bg-blue-900/30 border-blue-800/50',
            'Completed': 'text-green-400 bg-green-900/30 border-green-800/50',
            'Blocked': 'text-red-400 bg-red-900/30 border-red-800/50'
        };

        const RAID_STYLES = {
            'Risk': { bg: 'bg-amber-900', text: 'text-amber-300', dot: 'bg-amber-500' },
            'Assumption': { bg: 'bg-blue-900', text: 'text-blue-300', dot: 'bg-blue-500' },
            'Issue': { bg: 'bg-red-900', text: 'text-red-300', dot: 'bg-red-500' },
            'Dependency': { bg: 'bg-purple-900', text: 'text-purple-300', dot: 'bg-purple-500' }
        };

        const PROJECT_TYPE_STYLES = {
            'Key Project': { container: 'bg-amber-900/30 border-amber-700/50', text: 'text-amber-400', icon: 'fa-star' },
            'BAU Project': { container: 'bg-slate-800 border-slate-600', text: 'text-slate-300', icon: 'fa-rotate-right' },
            'UNASSIGNED': { container: 'bg-gray-800 border-gray-600', text: 'text-gray-400', icon: 'fa-circle-question' }
        };

        // Utility Date Functions for Task Filtering
        const getStartOfWeek = (d) => { const date = new Date(d); const day = date.getDay(); const diff = date.getDate() - day + (day === 0 ? -6 : 1); return new Date(date.setDate(diff)).setHours(0,0,0,0); };
        const getEndOfWeek = (d) => { const start = new Date(getStartOfWeek(d)); return new Date(start.setDate(start.getDate() + 6)).setHours(23,59,59,999); };
        const getStartOfMonth = (d) => { const date = new Date(d); return new Date(date.getFullYear(), date.getMonth(), 1).setHours(0,0,0,0); };
        const getEndOfMonth = (d) => { const date = new Date(d); return new Date(date.getFullYear(), date.getMonth() + 1, 0).setHours(23,59,59,999); };

        const App = () => {
            const [projects, setProjects] = React.useState([]);
            const [currentUser, setCurrentUser] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(true);
            const [error, setError] = React.useState(null);
            
            const [activeProjectId, setActiveProjectId] = React.useState(null);
            const [departmentFilter, setDepartmentFilter] = React.useState('ALL');
            
            const [displayStart, setDisplayStart] = React.useState(0);
            const [displayEnd, setDisplayEnd] = React.useState(11);
            const [displayYear, setDisplayYear] = React.useState(new Date().getFullYear());

            // Modal States
            const [isActivityModalOpen, setIsActivityModalOpen] = React.useState(false);
            const [editingActivity, setEditingActivity] = React.useState(null);
            
            const [isDetailsModalOpen, setIsDetailsModalOpen] = React.useState(false);
            const [isCapexModalOpen, setIsCapexModalOpen] = React.useState(false);
            const [isScopeModalOpen, setIsScopeModalOpen] = React.useState(false);
            
            const [isTaskModalOpen, setIsTaskModalOpen] = React.useState(false);
            const [editingTask, setEditingTask] = React.useState(null);
            const [timeView, setTimeView] = React.useState('WEEK'); // 'WEEK' or 'MONTH'

            const [isRaidModalOpen, setIsRaidModalOpen] = React.useState(false);
            const [editingRaidItem, setEditingRaidItem] = React.useState(null);
            const [raidFilter, setRaidFilter] = React.useState('ALL');
            
            const [isEditingTitle, setIsEditingTitle] = React.useState(false);
            const [tempTitle, setTempTitle] = React.useState('');

            const [isLogsModalOpen, setIsLogsModalOpen] = React.useState(false);
            const [logs, setLogs] = React.useState([]);
            
            const [isCommentsModalOpen, setIsCommentsModalOpen] = React.useState(false);
            const [commentActivity, setCommentActivity] = React.useState(null);

            const [isRaidCommentsModalOpen, setIsRaidCommentsModalOpen] = React.useState(false);
            const [commentRaidItem, setCommentRaidItem] = React.useState(null);

            React.useEffect(() => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((data) => {
                            setProjects(data.projects);
                            setCurrentUser(data.currentUser);
                            setIsLoading(false);
                        })
                        .withFailureHandler((err) => {
                            console.error(err);
                            setError("Failed to load data.");
                            setIsLoading(false);
                        })
                        .getDashboardData();
                } else {
                    setTimeout(() => { 
                        setProjects(initialData); 
                        setCurrentUser('mock.user@sph.com.sg');
                        setIsLoading(false); 
                    }, 800);
                }
            }, []);

            const syncProjectToBackend = (projectData) => {
                if (typeof google !== 'undefined' && google.script) {
                    const dataToSave = { ...projectData };
                    delete dataToSave.activities;
                    delete dataToSave.raidItems;
                    delete dataToSave.tasks;
                    google.script.run.upsertProject(dataToSave);
                }
            };

            const syncActivityToBackend = (activityData) => {
                if (typeof google !== 'undefined' && google.script) {
                    const dataToSave = { ...activityData };
                    delete dataToSave.comments; 
                    google.script.run.upsertActivity(dataToSave);
                }
            };

            const syncTaskToBackend = (taskData) => {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run.upsertTask(taskData);
                }
            };

            const syncRaidToBackend = (raidData) => {
                if (typeof google !== 'undefined' && google.script) {
                    const dataToSave = { ...raidData };
                    delete dataToSave.comments; 
                    google.script.run.upsertRaidItem(dataToSave);
                }
            };

            const fetchLogs = () => {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run.withSuccessHandler(setLogs).getLogs();
                }
            };
            
            // STREAMING_CHUNK: Replacing html2pdf with the highly optimized Native Print approach...
            const handleExportPDF = () => {
                // Temporarily swap the document title so the PDF saves with a clean, dynamic filename
                const originalTitle = document.title;
                let filename = 'SPH_Portfolio_Report';
                
                if (activeProjectId) {
                    const proj = projects.find(p => p.id === activeProjectId);
                    if (proj) {
                        filename = `SPH_Project_${proj.name.replace(/[^a-z0-9]/gi, '_')}`;
                    }
                } else {
                    const deptName = departmentFilter === 'ALL' ? 'All_Departments' : departmentFilter.replace(/[^a-z0-9]/gi, '_');
                    filename = `SPH_${deptName}_Report`;
                }
                
                document.title = filename;
                
                // Trigger the browser's native, vector-based PDF engine
                window.print();
                
                // Restore the original browser tab title after a short delay
                setTimeout(() => { document.title = originalTitle; }, 100);
            };

            const getRedLinePosition = () => {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentDay = now.getDate();
                const daysInMonth = new Date(now.getFullYear(), currentMonth + 1, 0).getDate();
                const visibleMonths = displayEnd - displayStart + 1;
                
                if (now.getFullYear() !== displayYear || currentMonth < displayStart || currentMonth > displayEnd) return -1; 
                const monthOffset = currentMonth - displayStart;
                const exactMonthFloat = monthOffset + (currentDay / daysInMonth);
                return (exactMonthFloat / visibleMonths) * 100;
            };

            const redLinePercent = getRedLinePosition();
            const visibleMonthsList = ALL_MONTHS.slice(displayStart, displayEnd + 1);

            const formatDateStr = (dateStr) => {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
            };

            const getBarStyles = (startMonth, duration, startYear) => {
                const absoluteActivityStart = (startYear * 12) + startMonth;
                const absoluteActivityEnd = absoluteActivityStart + duration;
                const absoluteDisplayStart = (displayYear * 12) + displayStart;
                const absoluteDisplayEnd = (displayYear * 12) + displayEnd;
                const visibleMonths = displayEnd - displayStart + 1;
                
                if (absoluteActivityEnd <= absoluteDisplayStart || absoluteActivityStart >= absoluteDisplayEnd + 1) return { display: 'none' };

                const visibleStart = Math.max(absoluteActivityStart, absoluteDisplayStart);
                const visibleEnd = Math.min(absoluteActivityEnd, absoluteDisplayEnd + 1);
                
                const leftPercent = ((visibleStart - absoluteDisplayStart) / visibleMonths) * 100;
                const widthPercent = ((visibleEnd - visibleStart) / visibleMonths) * 100;

                return { left: `${leftPercent}%`, width: `${widthPercent}%` };
            };

            const handleAddProject = () => {
                const newProject = {
                    id: `p${Date.now()}`, name: 'New Project', department: departmentFilter !== 'ALL' ? departmentFilter : 'Infra & Ops', 
                    projectType: '', sponsor: '', manager: '', techLead: '', teamMembers: '',
                    objective: '', scope: '', budget: '$0', actualSpend: '$0', overallStatus: 'Not Started',
                    activities: [], raidItems: [], tasks: []
                };
                setProjects([...projects, newProject]);
                syncProjectToBackend(newProject); 
                setActiveProjectId(newProject.id);
                setIsEditingTitle(true);
                setTempTitle('New Project');
            };

            const handleDeleteProject = (projectId) => {
                setProjects(projects.filter(p => p.id !== projectId));
                if (activeProjectId === projectId) setActiveProjectId(null);
                if (typeof google !== 'undefined' && google.script) google.script.run.deleteProject(projectId); 
            };

            const handleSaveActivity = (activityData) => {
                const updatedActivity = activityData.id ? activityData : { ...activityData, id: `a${Date.now()}` };
                updatedActivity.projectId = activeProjectId; 

                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) {
                        if (editingActivity && editingActivity.id) {
                            return { ...p, activities: p.activities.map(a => a.id === editingActivity.id ? updatedActivity : a) };
                        } else {
                            return { ...p, activities: [...p.activities, updatedActivity] };
                        }
                    }
                    return p;
                }));
                syncActivityToBackend(updatedActivity); 
                setIsActivityModalOpen(false);
            };

            const handleDeleteActivity = (activityId) => {
                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) return { ...p, activities: p.activities.filter(a => a.id !== activityId) };
                    return p;
                }));
                if (typeof google !== 'undefined' && google.script) google.script.run.deleteActivity(activityId); 
            };

            const handleSaveTask = (taskData) => {
                const updatedTask = taskData.id ? taskData : { ...taskData, id: `t${Date.now()}` };
                updatedTask.projectId = activeProjectId; 

                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) {
                        const tasksList = p.tasks || [];
                        if (editingTask && editingTask.id) {
                            return { ...p, tasks: tasksList.map(t => t.id === editingTask.id ? updatedTask : t) };
                        } else {
                            return { ...p, tasks: [...tasksList, updatedTask] };
                        }
                    }
                    return p;
                }));
                syncTaskToBackend(updatedTask); 
                setIsTaskModalOpen(false);
            };

            const handleDeleteTask = (taskId) => {
                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) return { ...p, tasks: (p.tasks || []).filter(t => t.id !== taskId) };
                    return p;
                }));
                if (typeof google !== 'undefined' && google.script) google.script.run.deleteTask(taskId); 
            };
            
            const handleSaveRaidItem = (raidData) => {
                const updatedRaid = raidData.id ? raidData : { ...raidData, id: `r${Date.now()}` };
                updatedRaid.projectId = activeProjectId; 

                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) {
                        const items = p.raidItems || [];
                        if (editingRaidItem && editingRaidItem.id) {
                            return { ...p, raidItems: items.map(r => r.id === editingRaidItem.id ? updatedRaid : r) };
                        } else {
                            return { ...p, raidItems: [...items, updatedRaid] };
                        }
                    }
                    return p;
                }));
                syncRaidToBackend(updatedRaid); 
                setIsRaidModalOpen(false);
            };

            const handleDeleteRaidItem = (raidId) => {
                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) return { ...p, raidItems: (p.raidItems || []).filter(r => r.id !== raidId) };
                    return p;
                }));
                if (typeof google !== 'undefined' && google.script) google.script.run.deleteRaidItem(raidId); 
            };
            
            const handleAddComment = (text) => {
                if (!text.trim() || !commentActivity) return;
                const emailToUse = currentUser || 'Unknown User';
                const newComment = { id: `c${Date.now()}`, activityId: commentActivity.id, timestamp: new Date().toISOString(), userEmail: emailToUse, commentText: text.trim() };

                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) {
                        return { ...p, activities: p.activities.map(a => a.id === commentActivity.id ? { ...a, comments: [...(a.comments || []), newComment] } : a) };
                    }
                    return p;
                }));
                
                setCommentActivity(prev => ({ ...prev, comments: [...(prev.comments || []), newComment] }));

                if (typeof google !== 'undefined' && google.script) google.script.run.addComment(commentActivity.id, newComment.commentText);
            };

            const handleAddRaidComment = (text) => {
                if (!text.trim() || !commentRaidItem) return;
                const emailToUse = currentUser || 'Unknown User';
                const newComment = { id: `rc${Date.now()}`, raidId: commentRaidItem.id, timestamp: new Date().toISOString(), userEmail: emailToUse, commentText: text.trim() };

                setProjects(projects.map(p => {
                    if (p.id === activeProjectId) {
                        return { ...p, raidItems: (p.raidItems || []).map(r => r.id === commentRaidItem.id ? { ...r, comments: [...(r.comments || []), newComment] } : r) };
                    }
                    return p;
                }));
                
                setCommentRaidItem(prev => ({ ...prev, comments: [...(prev.comments || []), newComment] }));

                if (typeof google !== 'undefined' && google.script) {
                    google.script.run.addRaidComment(commentRaidItem.id, newComment.commentText);
                }
            };
            
            const handleSaveProjectField = (field, value, targetId = activeProjectId) => {
                let updatedProject = null;
                const newProjects = projects.map(p => {
                    if (p.id === targetId) {
                        updatedProject = { ...p, [field]: value };
                        return updatedProject;
                    }
                    return p;
                });
                setProjects(newProjects);
                if (updatedProject) syncProjectToBackend(updatedProject); 
            };

            const handleSaveProjectDetails = (details) => {
                let updatedProject = null;
                const newProjects = projects.map(p => {
                    if (p.id === activeProjectId) {
                        updatedProject = { ...p, ...details };
                        return updatedProject;
                    }
                    return p;
                });
                setProjects(newProjects);
                if (updatedProject) syncProjectToBackend(updatedProject); 
                setIsDetailsModalOpen(false);
                setIsCapexModalOpen(false);
                setIsScopeModalOpen(false);
            };

            const handleTitleSave = () => {
                if (tempTitle.trim() !== '') handleSaveProjectField('name', tempTitle);
                setIsEditingTitle(false);
            };

            const renderDashboard = () => {
                const filteredProjects = projects.filter(p => departmentFilter === 'ALL' || p.department === departmentFilter);
                
                // Sort projects: 'Key Project' first, then others.
                const displayedProjects = [...filteredProjects].sort((a, b) => {
                    if (a.projectType === 'Key Project' && b.projectType !== 'Key Project') return -1;
                    if (a.projectType !== 'Key Project' && b.projectType === 'Key Project') return 1;
                    return 0; // Maintain existing order for others
                });

                return (
                    <div className="w-full max-w-7xl mx-auto mt-6 bg-sph-card-bg rounded-lg shadow-xl border border-sph-border overflow-hidden">
                        <div className="p-4 border-b border-sph-border bg-gray-800 flex justify-between items-center">
                            <h2 className="text-xl font-bold text-sph-blue">Executive Dashboard - Overview</h2>
                            
                            <div className="flex items-center space-x-3 text-sm text-gray-300 print-hide">
                                <span>Show:</span>
                                <select className="rounded px-2 py-1 bg-gray-700 border-gray-600 text-white" value={displayStart} onChange={(e) => setDisplayStart(Number(e.target.value))}>
                                    {ALL_MONTHS.map((m, i) => <option key={i} value={i} disabled={i > displayEnd}>{m}</option>)}
                                </select>
                                <span>to</span>
                                <select className="rounded px-2 py-1 bg-gray-700 border-gray-600 text-white" value={displayEnd} onChange={(e) => setDisplayEnd(Number(e.target.value))}>
                                    {ALL_MONTHS.map((m, i) => <option key={i} value={i} disabled={i < displayStart}>{m}</option>)}

                    const d = Math.max(1, Math.round((editingActivity.startMonth - m) * 30));

                    const m = Math.floor(endFloat);
                    const realY = y + Math.floor(m / 12);
                    const realM = m % 12;
                    const d = Math.max(1, Math.round((endFloat - m) * 30));
                    return `${realY}-${String(realM + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
